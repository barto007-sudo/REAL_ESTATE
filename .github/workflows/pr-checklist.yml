name: PR Checklist Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-checklist:
    name: Validate DoD Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR template checklist is complete
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const requiredChecks = [
              "Acceptance criteria are satisfied",
              "Code was reviewed",
              "No new critical or high security risk introduced",
              "Endpoint contract matches OpenAPI",
              "CI stages pass (install, lint, typecheck, test, build)"
            ];

            const missing = [];
            for (const check of requiredChecks) {
              const checked = new RegExp(`- \\[[xX]\\] .*${check.replace(/[.*+?^${}()|[\\]\\]/g, "\\$&")}`);
              if (!checked.test(body)) {
                missing.push(check);
              }
            }

            if (missing.length > 0) {
              core.setFailed(
                "PR checklist incompleto. Marca estos items antes de mergear: \n- " + missing.join("\n- ")
              );
            }
