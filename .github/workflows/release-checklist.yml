name: Release Checklist Validation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-release-checklist:
    name: Validate Release Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure checklist exists
        run: |
          if [ ! -f docs/planning/release-checklist.md ]; then
            echo "Missing docs/planning/release-checklist.md"
            exit 1
          fi

      - name: Ensure checklist is fully completed
        run: |
          UNCHECKED=$(grep -n "^- \[ \]" docs/planning/release-checklist.md || true)
          if [ -n "$UNCHECKED" ]; then
            echo "Release checklist has pending items:"
            echo "$UNCHECKED"
            exit 1
          fi

      - name: Summary
        run: echo "Release checklist validation passed."
